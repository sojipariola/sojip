# Ruff config for SOJIP backend
line-length = 100
target-version = "py311"

extend-exclude = [
    "alembic/versions",
    "htmlcov",
    ".pytest_cache",
]

[lint]
# Practical rule set — no B (bugbear) since FastAPI's Depends-in-defaults
# triggers B008 constantly and it's the canonical pattern.
select = ["E", "F", "I", "UP", "W"]

[lint.per-file-ignores]
"tests/**" = ["E501", "N806", "F401"]
"alembic/env.py" = ["E402", "F401"]
"app/utils/seed.py" = ["E501"]
